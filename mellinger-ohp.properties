# GingaForge: Mellinger 全天画像から作る OHPフィルム印刷用の天の川原盤。
# 例: gingaforge mellinger-ohp -f mellinger-ohp.properties
# 出力: output/mellinger-ohp/mellinger-ohp-plates.pdf（A4・1ページ。黒が遮光、白がインクなしの透明部分）
# Gaia方式（gaia-ohp.properties / gaia-etch.properties）とは入力も処理も別で、キーの名前も共通ではありません。

# 担当領域は全原盤で銀緯 -20度以上 +20度以下（latitude-limit-deg で変更）。
# N0: 銀経   0度以上  60度未満
# N1: 銀経  60度以上 120度未満
# S0: 銀経 300度以上 360度未満
# S1: 銀経 240度以上 300度未満
# 1ページに2列×2段で、上段の左から N0 / S0、下段の左から N1 / S1 を配置します。紙面の左が銀緯のマイナス側、右がプラス側です。

# このファイルは「キー = 値」の形式で、文字コードはUTF-8です。
# '#' から始まる行はコメント行であり、動作に影響を与えません。
# 値と同じ行にはコメントを書けません。また、行頭に空白を入れないでください（前の行の続きとみなされます）。

# Mellinger の科学用 RGB FITS（3600 × 1800 画素、0.1度/画素）。
# 設定ファイルの所在フォルダからの相対パス、または絶対パス。自動取得はしないため、READMEのURLから取得して置く。
source-fits = source/mwpan2_RGB_3600.fits

# 色の混合比。FITSの面の順（青, 緑, 赤）に3つの重みをカンマ区切りで書く。合計で割って使う。
# 0.5, 0.5, 0 は暗い所で働く目の感度（ピーク507 nm）を青と緑で近似したもの（肉眼の印象に近づける）。
# 0, 1, 0 にすると従来の緑のみ。赤はHα輝線（肉眼ではほぼ見えない）を含むため通常は0。
channel-weights = 0.5, 0.5, 0

# 星の除去。
#   starnet: StarNet2 で星と天の川の光に分け、恒星投影機・1等星投影機が映す星を除き、
#            それより暗い星の光はぼかして天の川の光に戻す（READMEの「星の除去」を参照）。
#   none: 星を除かない（元画像の星が点のまま残る）。
star-removal = starnet

# StarNet2 の実行ファイル。空欄なら、gingaforge install-starnet で tools/starnet2/ に導入したもの、
# なければ PATH 上の starnet2 を使う。どちらもなければ、対話できる端末では公式配布元からの導入を提案する。
# 特定の StarNet2 を使う場合は、コマンド名か絶対パスを書く。
# 初回は StarNet2 の利用条件（同梱の LICENSE.txt）への同意を確認する（条文ごとに一度）。
starnet-command =

# StarNet2 の2倍アップサンプリング（-u）。yes / no。
# Mellinger の星は1〜3画素と小さく、no では暗い星が粒状に多く残るため yes を推奨（全天で約30秒）。
starnet-upsample = yes

# 恒星投影機・1等星投影機と同じ星表。OTL の hip_main.dat（Hipparcos、CDS I/239）を gzip 圧縮したもの。
star-catalog = source/hip_main.dat.gz

# この等級以下（V等級、この値を含む）の星を除く。OTL の star.minimum（恒星投影機の最微星）に合わせる。
# 1.5等以下は1等星投影機が映すため、上限なしですべて除く。
star-catalog-limit-mag = 7.5

# 除く範囲の半径 (度)。半径 = star-mask-radius-deg + star-mask-growth-deg-per-mag × (star-catalog-limit-mag − V)。
# 初期値では 7.5等で0.15度（元画像の1.5画素）、1.5等で0.45度。
# 星表と画像の位置のずれは中央値0.25〜0.6画素、星の光の広がりは7.5等で約1画素、1等星で約4画素（実測）。
star-mask-radius-deg = 0.15
star-mask-growth-deg-per-mag = 0.05

# この等級以下の明るい星は、StarNet2 が消し切れずに残る淡いにじみ（1.5等より明るい星で半径約0.5度、+7〜9%）を、
# 除く範囲の1.5倍の円内で周囲の明るさから埋め直す（円の縁はぼかして混ぜる）。
halo-fill-limit-mag = 3

# star-catalog-limit-mag より暗い星の光をぼかす幅（ガウス関数のσ、度）。0ならぼかさず点のまま戻す。
# 除いた星の円の中は、周りの暗い星の光の平均で埋める（円の跡が暗く抜けないようにするため）。
faint-star-blur-deg = 0.3

# ぼかす前に、暗い星の光を1画素あたりこの値（元画像の値、black-level と同じ単位）で頭打ちにする。正の数。
# 元画像は細かい画像を双線形補間で縮小しているため、鋭い星は中心の明るさが1画素だけに写り、
# 同じ等級でも画素値が数十倍ばらつく（7.5〜8等で中央値約250、上位10%は2500以上）。
# 頭打ちにしないと、そのばらつきが0.3度ほどの丸い塊として残る。500で暗い星の光の約73%を残す。
faint-star-cap = 500

# 暗い星の光を戻す割合（0〜1）。1で光の量を保つ。0にすると星の光をすべて捨てる（天の川がより際立つ）。
faint-star-weight = 1

# 投影機の中心と原板の中心の間の距離 (mm)。原盤上の画像の大きさを決める。
#   画像の高さ = plate-distance-mm × 60度（ラジアン）× print-scale（print-scale = 1 で約52.36 mm）
#   画像の幅   = 2 × plate-distance-mm × tan(latitude-limit-deg) × print-scale（print-scale = 1 で約36.40 mm）
# 中心配置ではドーム半径が投影式に現れないため、ドーム半径の設定はありません。
plate-distance-mm = 50

# ドームの中心から投影機中心へのベクトルの赤道面に平行な成分 (mm)。
# この方式は投影機がドーム中心にある構成（中心配置）だけに対応し、0以外を指定するとエラーになる。
projector-horizontal-mm = 0

# ドームの中心から投影機中心へのベクトルの赤道面に垂直な成分 (mm)。0以外を指定するとエラーになる。
projector-vertical-mm = 0

# 原盤の左右の端に対応する銀緯 (度)。0より大きく90未満。
# Gaia方式の担当領域（銀緯±20度、変更不可）とそろえるため、通常は20のまま。
latitude-limit-deg = 20

# 後で何分の一の倍率にするか（Gaia方式の scale に相当）。1なら原寸。
# 画像の幅・高さにだけ掛かり、黒枠（95 mm四方）と配置は変わらない。
# 枠内のラベルと重ならないよう、幅が79 mm、高さが43 mmを超えるとエラー。
# 0.42017 で画像は幅約15.29 mm × 高さ約22.00 mm（長辺22 mm）。
print-scale = 0.42017

# 再投影した画像の解像度 (dpi)。72以上2400以下。
# 元画像の1画素（0.1度）は print-scale = 1 の原盤上で約0.09 mm（約290 dpi）、0.42017 では約0.037 mm（約690 dpi）に相当する。
# これより上げても観測情報は増えず、補間で滑らかになるだけ。
raster-dpi = 1200

# 以下は濃淡の変換。4区画共通で、区画ごとの自動露出はしない。
# 色の混合と星の除去を終えた値 F（元FITSと同じ単位、物理単位の記載なし）を、次の順で 0（黒、遮光）〜255（白、透明）の画素値にする。
#   1. u = (F − black-level) × exposure ÷ (white-level − black-level) を 0〜1 に切り詰める
#   2. tone-mode = asinh なら u = asinh(u ÷ asinh-softening) ÷ asinh(1 ÷ asinh-softening)
#   3. 画素値 = 255 × u^(1 ÷ display-gamma)
# 画素値は空の明るさに比例しない。プリンターの灰色と実際のフィルム透過率も一致しないため、試し刷りで調整する。

# 階調の圧縮方法。
#   asinh: 暗い部分を持ち上げ、明るい部分を圧縮する（観察用）。強さは asinh-softening で決める。
#   linear: 元の強度に対して線形（手順2を省略）。
tone-mode = asinh

# 黒（遮光）にする値。これ以下は真っ黒になる。上げると天の川の外側の暗い部分が黒く締まり、天の川が細くなる。
# 180 は初期設定（青0.5＋緑0.5、星の除去あり）の4区画を300 dpiで再投影した値の約30パーセンタイル（181）。
# 星を除かない場合（star-removal = none）は星の点で値が上がるため、210前後が目安。
black-level = 180

# 白（透明）にする値（exposure = 1 のとき）。これ以上は真っ白に飽和する。
# 600 は同じく約99パーセンタイル（612）。銀河中心付近は飽和する。
white-level = 600

# asinh 圧縮の強さ。tone-mode = asinh のときだけ使用。正の数。
# 小さいほど暗い部分が明るく持ち上がる。大きいほど linear に近づく。
asinh-softening = 0.4

# 明るさの倍率。正の数。1なら変更なし。全体が暗ければ上げ、明るすぎれば下げる。
# 例えば 0.5 なら、元画像で black-level + 2 × (white-level − black-level) の値で白になる。
exposure = 0.5

# 最後に掛けるガンマ。正の数。1なら変更なし。1より大きいと中間調が明るく、小さいと暗くなる。
display-gamma = 1
