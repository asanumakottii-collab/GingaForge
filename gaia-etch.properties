# GingaForge: Gaia DR3 エッチング用天の川原盤。
# 実行時に、コマンドラインオプションとして -f (このファイルの名前) を渡すことで使用できます。
# 例: python3 generate.py gaia-etch -f gaia-etch.properties

# 担当領域は全原盤で銀緯 -20度以上 +20度以下。
# N0: 銀経   0度以上  60度未満
# N1: 銀経  60度以上 120度未満
# S0: 銀経 300度以上 360度未満
# S1: 銀経 240度以上 300度未満
# 銀経120度以上240度未満は対象外。0度と360度は同じ境界。
# N/Sは用紙の上段/下段の識別子で、銀緯の正負を意味しません。

# このファイルの文法は、Javaのプロパティファイルの仕様に準じます。
# この行のように、'#' から始まる行はコメント行であり、動作に影響を与えません。

# 後で何分の一の倍率にするか
scale = 1

# 7.5等星の半径 (mm)
star-radius-7.5 = 0.1

# ドームの半径 (mm)
dome-radius = 6500

# ドームの中心から投影機中心へのベクトルの赤道面に平行な成分 (mm)
projector-horizontal = 0

# ドームの中心から投影機中心へのベクトルの赤道面に垂直な成分 (mm)
projector-vertical = 0

# 投影機の中心と原板の中心の間の距離 (mm)
plate-distance = 50

# Gaia入力。設定ファイルの所在フォルダからの相対パス、または絶対パス。
# 通常は --download-gaia で取得したキャッシュフォルダ。
# 個別星CSV/CSV.gz（source_id,ra,dec,phot_g_mean_mag列）も指定可能。
galaxy.gaia.input = source/gaia

# Gaia DR3のG等級。
# 最輝側を含まず、最微側を含む。恒星投影機との境界はGとVの違いも含めて実測調整する。
galaxy.gaia.bright-limit = 7.5
galaxy.gaia.faint-limit = 17

# このG等級の光量を star-radius-7.5 の穴面積に対応させる（Vへの変換ではない）。
galaxy.gaia.reference-magnitude = 7.5

# Gaia Archiveで光量を合計する銀経・銀緯ビンの幅（度）。0.05〜1、60度を等分する値。
# 等級・ビン幅変更時は --download-gaia で再取得。加工条件だけの変更なら再取得不要。
galaxy.gaia.sky-bin-deg = 0.1

# Gaia原盤のファイル名の接頭辞。
galaxy.gaia.file.prefix = gaia-etch-

# 以下は未実測の仮値。最終的な金属原盤での寸法(mm)。scale倍して製図する。
# 最小穴の「直径」（半径ではない）
galaxy.etch.min-hole-diameter-mm = 0.02
# 隣り合う穴の縁と縁の間に残す金属の最小幅
galaxy.etch.min-web-mm = 0.2

# 原盤上で光量をまとめるセル幅(mm)。穴径＋金属幅の整数倍に切り下げる。
# 大きいほど光をまとめやすいが、暗黒帯などの細部も平滑化される。
galaxy.etch.cell-size-mm = 0.4

# 全領域共通の光量倍率。穴面積の合計に掛ける。飽和損失はreport.jsonに出力。
# Gaia微光星の光量が増えるため、まず0.05で試作。1.0では密集部の穴容量を超えやすい。
galaxy.etch.flux-gain = 0.05
# セル内の穴の選び方を固定する乱数種。同じ入力・設定なら同じ原盤になる。
galaxy.etch.seed = 0

# 横に各段の原盤をいくつ配置するか（標準設定では1用紙に上下2枚、計2用紙）
plate.column = 1

# 縦に各段の原盤をいくつ配置するか
plate.row = 1

# 正方形原盤の一辺 (出力上のmm)。0の場合は用紙サイズから自動計算。
# 恒星用の設定とは独立。例: 100なら100×100 mm。scaleは掛かりません。
plate.frame-size = 60

# 設定ファイルからの相対パス、または絶対パス（galaxy は自動作成）
output.directory = output_inverse

# 白黒反転するか
#   yes: 原板が黒、星が白（エッチング）
#   no: 原板が白、星が黒（リスフィルム）
color.invert = no
