# GingaForge: Gaia DR3 から作る OHPフィルム印刷用の天の川原盤。
# 例: gingaforge gaia-ohp（gingaforge gaia-etch -f gaia-ohp.properties と同じ）
# 出力: output/gaia-ohp/inverted/gaia-ohp-*.pdf（黒地に白穴。黒いインクが遮光、穴が透過）
# 金属エッチング用の gaia-etch.properties とは、集計セル幅・白黒・天の川強調が異なります。

# 担当領域は全原盤で銀緯 -20度以上 +20度以下。
# N0: 銀経   0度以上  60度未満
# N1: 銀経  60度以上 120度未満
# S0: 銀経 300度以上 360度未満
# S1: 銀経 240度以上 300度未満

# このファイルの文法は、Javaのプロパティファイルの仕様に準じます。

# 後で何分の一の倍率にするか
scale = 0.36666667

# 7.5等星の半径 (mm)
star-radius-7.5 = 0.036666667

# ドームの半径 (mm)
dome-radius = 6500

# ドームの中心から投影機中心へのベクトルの赤道面に平行な成分 (mm)
projector-horizontal = 0

# ドームの中心から投影機中心へのベクトルの赤道面に垂直な成分 (mm)
projector-vertical = 0

# 投影機の中心と原板の中心の間の距離 (mm)
plate-distance = 50

# Gaia入力。設定ファイルの所在フォルダからの相対パス、または絶対パス。
galaxy.gaia.input = source/gaia

# Gaia DR3のG等級。等級・ビン幅変更時は --download-gaia で再取得。
galaxy.gaia.bright-limit = 7.5
galaxy.gaia.faint-limit = 17
galaxy.gaia.reference-magnitude = 7.5
galaxy.gaia.sky-bin-deg = 0.1

# OHPフィルム印刷用の穴。最終原盤での寸法(mm)。
galaxy.etch.min-hole-diameter-mm = 0.02
galaxy.etch.min-web-mm = 0.02
galaxy.etch.cell-size-mm = 0.2

# 全領域共通の光量倍率。天の川強調の後の穴面積にも掛かる。全体が暗ければ上げる。
galaxy.etch.flux-gain = 0.05
galaxy.etch.seed = 0

# 天の川強調。yes: 背景（天の川の外側の一様な明るさ）を差し引き、天の川だけを残す。
# no: G帯光量に比例した従来の穴面積。
galaxy.etch.milky-way = yes

# 平滑化した明るさがこのパーセンタイル以下の場所を遮光する（黒点）。
# 上げると外側が暗く・天の川が細くなる。下げると外側の光が戻る。目安 30〜60。
galaxy.etch.milky-way.black-percentile = 40

# この明るさの場所は従来（強調なし）と同じ穴面積。これより明るい天の川中心部はさらに明るくなる。
# 下げると天の川全体が明るくなるが、中心部が飽和しやすい（容量不足は実行時に画面に表示）。
galaxy.etch.milky-way.anchor-percentile = 95

# 黒点から基準点までの階調。1は直線。1より大きいと天の川の縁がより暗く、中心が際立つ。
galaxy.etch.milky-way.gamma = 1

# 明るさを測るときの平滑化（中央値）の範囲(mm)。原盤上1 mmは銀経約1.1度。
# 孤立した明るい星を背景と見なさないための幅で、暗黒帯などの細部は平滑化されません。
galaxy.etch.milky-way.smoothing-mm = 1

# 横・縦に各段の原盤をいくつ配置するか（1用紙に上下2枚、計2用紙）
plate.column = 1
plate.row = 2

# 正方形原盤の一辺 (出力上のmm)。
plate.frame-size = 22

# 白黒反転するか。出力先は設定ファイルと同じフォルダの output/<設定ファイル名>/ 以下で自動的に決まる。
# ファイル名の接頭辞も設定ファイル名（このファイルなら gaia-ohp-0.pdf, gaia-ohp-1.pdf）。
#   yes: 原板が黒、星が白（OHPでは黒いインクが遮光） → output/gaia-ohp/inverted/
#   no: 原板が白、星が黒 → output/gaia-ohp/normal/
color.invert = yes
