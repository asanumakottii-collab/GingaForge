# GingaForge: Gaia DR3 から作る OHPフィルム印刷用の天の川原盤。
# 例: gingaforge gaia-ohp（gingaforge gaia-etch -f gaia-ohp.properties と同じ）
# 出力: output/gaia-ohp/inverted/gaia-ohp-*.pdf（黒地に白。黒いトナー・インクが遮光、白が透過）
# 金属エッチング用の gaia-etch.properties とは、描き方（render）・集計セル幅・光量倍率・天の川強調が異なります。

# 担当領域は全原盤で銀緯 -20度以上 +20度以下。
# N0: 銀経   0度以上  60度未満
# N1: 銀経  60度以上 120度未満
# S0: 銀経 300度以上 360度未満
# S1: 銀経 240度以上 300度未満

# このファイルの文法は、Javaのプロパティファイルの仕様に準じます。

# 後で何分の一の倍率にするか
scale = 0.36666667

# 7.5等星の半径 (mm)
star-radius-7.5 = 0.036666667

# ドームの半径 (mm)
dome-radius = 6500

# ドームの中心から投影機中心へのベクトルの赤道面に平行な成分 (mm)
projector-horizontal = 0

# ドームの中心から投影機中心へのベクトルの赤道面に垂直な成分 (mm)
projector-vertical = 0

# 投影機の中心と原板の中心の間の距離 (mm)
# 穴の範囲は 縦（銀経60度）= plate-distance × 60度（ラジアン）× scale、
# 横（銀緯±20度）= 2 × plate-distance × tan(20度) × scale。
# 57.2957（= 180/π）で縦が出力上22 mm、横が約15.3 mm（対角線は約26.8 mmで、直径30 mmの円形枠に収まる）。原盤上1 mmは銀経1度。
plate-distance = 57.2957

# Gaia入力。設定ファイルの所在フォルダからの相対パス、または絶対パス。
galaxy.gaia.input = source/gaia

# Gaia DR3のG等級。等級・ビン幅変更時は --download-gaia で再取得。
galaxy.gaia.bright-limit = 7.5
galaxy.gaia.faint-limit = 17
galaxy.gaia.reference-magnitude = 7.5
galaxy.gaia.sky-bin-deg = 0.1

# 描き方。開口率（各セルで必要な穴面積 ÷ セル面積）を次のどれで描くか。
#   gray: 8ビットの階調画像。網点化はプリンターに任せる（レーザーでは規則的な網点が投影で格子模様に見えることがある）。
#   dither: 誤差拡散で raster-dpi の点（白い画素）にする。点の位置は不規則で、プリンターの網点を通さず、設計どおりに印刷される。
#   holes: 円形の穴（gaia-etch と同じ）。穴は出力上 直径約7.3 µm で、プリンターの1画素（1200 dpi で約21 µm）より小さく、印刷で太る・消える。
galaxy.ohp.render = gray

# gray・dither の画像の解像度 (dpi)。72以上2400以下。プリンターの解像度か、その整数分の1にする。
# 1200 dpi のプリンターで 600 にすると、dither の点が2×2画素になり、トナーで埋まりにくい。
galaxy.ohp.raster-dpi = 1200

# 光量をまとめるセル幅 (mm、縮小前)。原盤上1 mmは銀経1度なので、0.1 で Gaia の集計ビン（0.1度）と同じ細かさ。
# holes では穴径＋金属幅の整数倍に切り下げる。
galaxy.ohp.cell-size-mm = 0.1

# holes の穴。最終原盤での寸法(mm)。gray・dither では使わない。
galaxy.ohp.min-hole-diameter-mm = 0.02
galaxy.ohp.min-web-mm = 0.02
galaxy.ohp.seed = 0

# 全領域共通の光量倍率。開口率（穴面積の合計）に掛かり、天の川強調の後にも掛かる。全体が暗ければ上げる。
# 0.2 で、天の川の明るい所（95パーセンタイル）の開口率が約25%、最も明るい所（99.9パーセンタイル）が約90%。
galaxy.ohp.flux-gain = 0.2

# 天の川強調。yes: 背景（天の川の外側の一様な明るさ）を差し引き、天の川だけを残す。
# no: G帯光量に比例した開口率（穴面積）。
galaxy.ohp.milky-way = yes

# 平滑化した明るさがこのパーセンタイル以下の場所を遮光する（黒点）。
# 上げると外側が暗く・天の川が細くなる。下げると外側の光が戻る。目安 30〜60。
galaxy.ohp.milky-way.black-percentile = 40

# この明るさの場所は従来（強調なし）と同じ穴面積。これより明るい天の川中心部はさらに明るくなる。
# 下げると天の川全体が明るくなるが、中心部が飽和しやすい（容量不足は実行時に画面に表示）。
galaxy.ohp.milky-way.anchor-percentile = 95

# 黒点から基準点までの階調。1は直線。1より大きいと天の川の縁がより暗く、中心が際立つ。
galaxy.ohp.milky-way.gamma = 1

# 明るさを測るときの平滑化（中央値）の範囲(mm)。原盤上1 mmは銀経1度。
# 孤立した明るい星を背景と見なさないための幅で、暗黒帯などの細部は平滑化されません。
galaxy.ohp.milky-way.smoothing-mm = 1

# 横・縦に各段の原盤をいくつ配置するか（1列に上段 N0・N1、下段 S0・S1 の4枚を縦に並べる）
plate.column = 1
plate.row = 2

# 列の数。用紙を横に等分し、各列に N0〜S1 の4枚を1組ずつ、左の列から並べる（1用紙に計 4 × column.count 枚）。
# 列ごとに設定を変えて、1枚の試し刷りで比べるためのもの。1なら従来どおり1組だけ。
column.count = 4

# column.<列番号>.<キー> = 値 で、その列（左から1, 2, ...）だけ、このファイルの <キー> の値を変える。
# 書かなかったキーは、このファイルの値のまま。<キー> はこのファイルに書いてあるものに限る（打ち間違い防止）。
# plate.* と color.invert は全列共通。
# 変えた設定は、PDF・SVGの各列の上に「#列番号」と「キー = 値」で書き出す。各原盤の名前にも列番号を付ける（例: N0 #2）。
# 同梱の設定は描き方の比較: 列1 階調、列2 点描（1200 dpi、1画素の点）、列3 点描（600 dpi、2×2画素の点）、
# 列4 従来の穴（比較用。以前の集計セル幅・光量倍率）。
column.1.galaxy.ohp.render = gray
column.2.galaxy.ohp.render = dither
column.3.galaxy.ohp.render = dither
column.3.galaxy.ohp.raster-dpi = 600
column.4.galaxy.ohp.render = holes
column.4.galaxy.ohp.cell-size-mm = 0.2
column.4.galaxy.ohp.flux-gain = 0.05

# 円形原盤の直径 (出力上のmm)。枠の外側の穴・画像は出力しない。
plate.frame-diameter = 30

# 白黒反転するか。出力先は設定ファイルと同じフォルダの output/<設定ファイル名>/ 以下で自動的に決まる。
# ファイル名の接頭辞も設定ファイル名（このファイルなら gaia-ohp-0.pdf, gaia-ohp-1.pdf）。
#   yes: 原板が黒、星が白（OHPでは黒いインクが遮光） → output/gaia-ohp/inverted/
#   no: 原板が白、星が黒 → output/gaia-ohp/normal/
color.invert = yes
