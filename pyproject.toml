[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gingaforge"
version = "0.1.0"
description = "銀河投影機（ぎんとう）用の天の川原盤（OHPフィルム・Gaiaエッチング）生成ライブラリ"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "東京大学地文研究会天文部" }]
dependencies = [
    "astropy>=7,<9",
    "numpy>=2,<3",
    "Pillow>=11,<13",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
test = ["pypdf>=5,<8"]

[project.scripts]
gingaforge = "gingaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
