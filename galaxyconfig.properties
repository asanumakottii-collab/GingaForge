# Mellinger 全天画像から作る OHP 原盤。UTF-8。
source-fits = source/mwpan2_RGB_3600.fits
output-directory = output

# 現在の OTL に合わせた中心配置の円筒投影。偏心は未対応。
plate-distance-mm = 50
projector-horizontal-mm = 0
projector-vertical-mm = 0
latitude-limit-deg = 20
print-scale = 1
raster-dpi = 1200

# 4区画共通。元FITSの緑成分の数値を使用（物理単位の記載なし）。
# white-level=1500 は対象帯の元画像の約99パーセンタイルを参考に設定。
# tone-mode: asinh（観察用の階調圧縮）/ linear（元の強度に対して線形）
tone-mode = asinh
black-level = 0
white-level = 1500
asinh-softening = 0.05
exposure = 1
display-gamma = 1
